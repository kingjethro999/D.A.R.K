okhttp = "4.12.0"
serialization = "1.8.0"
coreKtx = "1.16.0"
healthConnect = "1.1.0"
media3 = "1.5.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
